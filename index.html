<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brieva O.</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">

</head>
<body>
    <style>
        @font-face {
            font-family: 'neue';
            src: url(fonts/NeueMontreal-Medium.otf);
        }


        body {
            margin: 0;
            padding: 0; box-sizing: border-box;
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(0, 0, 0, 0.833);
            overflow-x: hidden;
            overflow-y: hidden;
            flex-direction: column;
            /* box-shadow: 0 0 35px rgb(255, 255, 255); */
            /* background-image: linear-gradient(#0006, #000000aa); */
            /* box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.5); */
            /* background: radial-gradient(circle at top, rgba(31, 28, 28, 0.8), rgba(0, 0, 0, 0.5)); 
                width: 100%; 
                height: 100vh; 
                box-shadow: 0 -10px 30px rgba(255, 255, 255, 0.5); */
        }

        .background-light {
            position: relative;
            margin: 0 auto;
            padding: 0%;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at top, rgba(255, 247, 247, 0.090), rgb(0, 0, 0));
            /* overflow: hidden;     */
        }
        .background-light::before {
            content: '';
            padding: 0%;
            margin: 0% auto;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            box-shadow: 0 -10px 30px rgba(32, 31, 31, 0.874);
            z-index: -1;
        }
        .nama {
            position: fixed;
            left: 45px;
            top: 14px;
            font-weight: normal;
            font-size: 22px;
        }
        .spesialisasi {
            position: fixed;
            left: 45px;
            top: 47px;
            opacity: 75%;
            font-weight: normal;
            font-size: 12px;
        }
        .yt {
            position: fixed;
            top: 56px;
            right: 178px;
            font-size: 13px;
            font-style: normal;
            font-weight: normal;
            font-family: 'neue';
            text-decoration: none;
            color: #ffffff;
        }
        .rsm {
            position: fixed;
            top: 56px;
            right: 68px;
            font-size: 13px;
            font-style: normal;
            font-weight: normal;
            font-family: 'neue';
            text-decoration: none;
            color: #ffffff;
        }
        .panahAsmara {
            position: fixed;
            right: 158px;
            top: 54px;
            height: 20px;
            width: 20px;
            color: #ffffff;
        }
        .panahAsmara2 {
            position: fixed;
            right: 47px;
            top: 54px;
            height: 20px;
            width: 20px;
            color: #ffffff;
        }

/* ######################## OPSI GLOWING ########################### */
        .navbarAtas {
            flex-direction: column;
            width: 100vw;
            height: 100px;
        }
        .button-container { 
            position: fixed;
            top: 39px;
            left: 655px; 
            display: flex; 
            width: 200px;
            background: rgba(255, 255, 255, 0.07); 
            backdrop-filter: blur(10px);
            border: 2px solid #86868633; 
            opacity: 75%;
            border-radius: 20px; 
            /* overflow: hidden;  */
            z-index: 5;
        } 

        .option-btn { flex: 1;
            padding: 10px; 
            border: none; 
            background-color: transparent; 
            color: #ffffff; 
            cursor: pointer; 
            font-size: 16px; 
            transition: color 0.3s; 
        }

        .option-btn:hover { 
            color: #fbfdfe; 
        } 

        .slider { 
            position: absolute; 
            top: -4px; 
            left: 12%; 
            width: 25%; 
            height: 3px; 
            background-color: #ffffff; 
            transition: left 0.3s;
            box-shadow: 0 0 20px rgb(255, 255, 255), /* Efek glow */
                        0 0 25px rgb(255, 255, 255),
                        0 0 25px rgb(255, 255, 255);
            z-index: 1;
        }
        .sliderPilihan {
            position: absolute;
            top: 3px;
            left: 4px; 
            display: flex; 
            width: 91px;
            height: 32px;
            /* background: rgba(255, 255, 255, 0.07); */
            background-color: #747070d7;
            backdrop-filter: blur(10px); 
            opacity: 30%;
            border-radius: 20px;
            z-index: -1; 
            transition: left 0.3s;
        }
        
/* #################### TAB OPENING #################### */

        .frameTab1 {
            display: flex;
            justify-content: center; 
            align-items: center;
            margin: 0% auto;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.24), rgba(0, 0, 0, 0.662));
            /* opacity: 30%; */
            position: relative;
            top: 60px;
            left: 0px;
            height: 800px;
            width: 1040px;
            /* background-color: rgba(72, 67, 67, 0); */
            border: 2px solid #6868688d;
            /* border-width: 20px; */
            border-radius: 3%;
            box-shadow: 0 0 90px rgba(0, 0, 0, 0.478);
            z-index: 2;
            transition: left 0.7s ease, opacity 0.6s ease;
            overflow: hidden;
        }
        .frameTab1::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -80%; 
            width: 100px; 
            height: 100%; 
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.8), transparent); 
            transform: skewX(160deg);
            animation: shimmer 5s infinite; 
            opacity: 5%;
            /* box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.5); */
        } 
        @keyframes shimmer { 
            0% { left: -80%; } 
            /* 50% { left: 110%; }  */
            100% { left: 380%; } 
        }
        .frameTab1::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -180%; 
            width: 50px; 
            height: 100%; 
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.8), transparent); 
            transform: skewX(160deg);
            animation: shimmer 5s infinite; 
            opacity: 5%;
            /* box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.5); */
        } 
        @keyframes shimmer { 
            0% { left: -180%; } 
            /* 50% { left: 110%; }  */
            100% { left: 180%; } 
        }
        /* ================= SMOOTH TRANSITION PATCH ================= */
        .frameTab1,
        #frameTabPhotos {
            position: absolute;      /* sama posisi untuk keduanya */
            top: 190px;               /* sama seperti yang kamu pakai untuk frameTab1 */
            left: 50%;               /* center anchor */
            width: 1040px;
            height: 800px;
            transform: translateX(calc(-50%)); /* default: centered */
            transition: transform 0.7s cubic-bezier(0.25,0.1,0.25,1), opacity 0.6s ease;
            will-change: transform, opacity;
            margin: 0;
            z-index: 2;
        }

        .inpo {
            font-family: 'neue';
            color: #ffffff;
            position: absolute;
            right: 198px;
            top: 452px;
            z-index: 5;
            font-size: 24px;
            opacity: 90%;
        }
        .inpo2 {
            font-family: 'neue';
            color: #ffffff;
            position: absolute;
            right: 282px;
            top: 484px;
            z-index: 5;
            font-size: 24px;
            opacity: 38%;
        }
       
/* ###################### SLOGAN ####################### */
        .slogan {
            position: absolute;
            top: 48px;
            right: 109px;
            color: #ffffff;
            font-size: 300px;
            text-align: left;
            /* font-family: "Gloock", serif; */
            font-family: 'neue';
            letter-spacing: -2px;
            line-height: 85px;
            text-shadow: 1px 10.5px 20px rgba(3, 0, 64, 0.403), /* Bayangan kiri bawah */ 
                        -1px -7px 30px rgba(255, 255, 255, 0.366); /* Efek highlight kanan atas */ 
            z-index: 5;
        }
        .stories {
            font-family: "Gloock", serif;
            /* color: #ffffff; */
            background: linear-gradient(90deg, #FF6F61, #6B5B95, #88B04B); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; /* Tambahan untuk browser non-WebKit */ 
            color: transparent;
            text-shadow: 1px 12px 20px rgba(3, 0, 64, 0.327), /* Bayangan kiri bawah */ 
                        -1px -4px 30px rgba(255, 255, 255, 0.366); /* Efek highlight kanan atas */ 
        }

        html, body { min-height: 100%; }
        body { min-height: 100svh; height: auto; overflow-x: clip; overflow-y: auto; }
        .background-light { min-height: 100svh; height: auto; padding: 0 1rem 2rem; box-sizing: border-box; overflow-x: clip; }
        .button-container { left: 50%; top: 2.25rem; transform: translateX(-50%); }
        .frameTab1, #frameTabPhotos {
            top: clamp(7.5rem, 18vh, 11.875rem);
            left: 50%; width: min(65rem, calc(100vw - 2rem));
            height: min(50rem, calc(100svh - 9rem)); min-height: 32rem; box-sizing: border-box;
        }
        .slogan { right: clamp(1.5rem, 9vw, 7rem); top: clamp(2rem, 7vh, 4rem); font-size: clamp(2.75rem, 7vw, 6rem); line-height: .9; }
        .inpo, .inpo2 { right: clamp(1.5rem, 10vw, 11rem); font-size: clamp(1rem, 2.2vw, 1.5rem); }
        .inpo { top: 55%; } .inpo2 { top: 60%; }
        .pap-carousel {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: clamp(2rem, 5vw, 4rem) clamp(3.5rem, 9vw, 7rem) clamp(4rem, 10vw, 7rem) clamp(1.5rem, 5vw, 4rem); box-sizing: border-box;
        }
        .pap-slides { position: relative; width: min(100%, 48rem); height: 100%; overflow: hidden; border-radius: 1rem; background: rgba(0, 0, 0, .25); }
        .pap-slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; margin: 0; opacity: 0; transform: translateY(18%); transition: opacity .65s ease, transform .65s cubic-bezier(.22, .61, .36, 1); pointer-events: none; }
        .pap-slide.is-active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .pap-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .pap-caption { position: relative; z-index: 1; padding: clamp(2rem, 5vh, 3.5rem) clamp(1rem, 3vw, 2rem) 1.25rem; color: #fff; font-family: 'neue', Arial, sans-serif; font-size: clamp(1rem, 2vw, 1.4rem); text-shadow: 0 1px 3px rgba(0, 0, 0, .65); background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, .28) 35%, rgba(0, 0, 0, .86) 100%); }
        .pap-indicators { position: absolute; right: clamp(1rem, 3vw, 2rem); top: 50%; display: flex; flex-direction: column; gap: .75rem; transform: translateY(-50%); z-index: 2; }
        .pap-indicator { width: .6rem; height: .6rem; padding: 0; border: 1px solid rgba(255, 255, 255, .8); border-radius: 50%; background: transparent; cursor: pointer; transition: transform .25s ease, background-color .25s ease; }
        .pap-indicator.is-active { background: #fff; transform: scale(1.45); }
        @media (max-width: 600px) {
            .nama { left: 1rem; top: .75rem; font-size: 1.15rem; } .spesialisasi { left: 1rem; top: 2.45rem; font-size: .65rem; }
            .yt { top: 1rem; right: 5.5rem; font-size: .7rem; } .rsm { top: 1rem; right: 1rem; font-size: .7rem; }
            .panahAsmara, .panahAsmara2 { display: none; } .button-container { top: 4.5rem; width: min(13rem, calc(100vw - 2rem)); }
            .option-btn { padding: .65rem .4rem; font-size: .85rem; }
            .frameTab1, #frameTabPhotos { top: 7.5rem; width: calc(100vw - 1rem); height: calc(100svh - 8.5rem); min-height: 30rem; }
            .pap-carousel { padding: 1.25rem 2.75rem 2.5rem 1rem; } .pap-indicators { right: .85rem; }
        }

        .frameTab1 {
            display: block;
            overflow: hidden;
            border-radius: 1.25rem;
            background: rgba(0, 0, 0, .35);
        }

        .browser-frame {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .28);
            border-radius: inherit;
            background: #080808;
            box-shadow: 0 1rem 4rem rgba(0, 0, 0, .45);
        }

        .browser-bar {
            position: relative;
            flex: 0 0 clamp(2rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: linear-gradient(180deg, #bdbdbd 0%, #888 48%, #6b6b6b 100%);
            border-bottom: 1px solid rgba(0, 0, 0, .55);
            box-shadow: inset 0 1px rgba(255, 255, 255, .5);
        }

        .window-controls { display: flex; align-items: center; gap: .45rem; }
        .window-control {
            width: .78rem;
            height: .78rem;
            padding: 0;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 1px rgba(255, 255, 255, .45), 0 1px 2px rgba(0, 0, 0, .35);
        }
        .window-control--red { background: #ff3b30; }
        .window-control--orange { background: #ffcc00; }
        .window-control--green { background: #34c759; }
        .window-control:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        .frame-content {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            background: radial-gradient(circle at top, rgba(255, 255, 255, .1), rgba(0, 0, 0, .72));
        }

        .home-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
            padding: 2rem clamp(2rem, 9vw, 8rem);
            box-sizing: border-box;
        }
        .home-content .slogan, .home-content .inpo, .home-content .inpo2 { position: static; margin: 0; right: auto; top: auto; }
        .home-content .slogan { max-width: 75%; }
        .home-content .inpo { margin-top: 2.5rem; }
        .home-content .inpo2 { margin-top: .35rem; }

        .pap-carousel { position: absolute; inset: 0; padding: 1rem clamp(2.75rem, 8vw, 6rem) 1rem 1rem; }
        .pap-slides { width: 100%; height: 100%; border-radius: .35rem; }
        .pap-caption.is-hidden { opacity: 0; }
        .pap-caption { transition: opacity .3s ease; }

        @media (max-width: 600px) {
            .home-content { padding: 1.5rem; }
            .home-content .slogan { max-width: 100%; }
            .pap-carousel { padding: .65rem 2.5rem .65rem .65rem; }
        }

        .frameTab1,
        .browser-frame {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .home-content .inpo,
        .home-content .inpo2 {
            align-self: flex-end;
            width: min(100%, 30rem);
            text-align: right;
            /* // turunin */
            transform: translateY(clamp(1.25rem, 2.2vh, 1.75rem));
        }

        .pap-carousel {
            padding: 0;
        }

        .pap-slides {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        .pap-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pap-indicators {
            right: clamp(.75rem, 2vw, 1.5rem);
        }

        @media (max-width: 600px) {
            .pap-carousel { padding: 0; }
        }

        .home-content {
            container-type: inline-size;
        }

        .home-content .slogan {
            width: 100%;
            max-width: none;
            --slogan-font-size: clamp(.80rem, 7.4cqi, 8rem);
            font-size: var(--slogan-font-size);
        }

        .home-content .stories {
            font-size: var(--slogan-font-size);
        }

        .slogan-line {
            display: block;
            width: 100%;
            white-space: nowrap;
        }

        @supports (font-size: 1cqi) {
            .home-content .slogan {
                --slogan-font-size: clamp(.80rem, 7.4cqi, 8rem);
            }
        }
        
        
    </style>


    <div class="background-light">
        <div class="navbarAtas">
            <h2 class="nama" style="color: rgba(247, 247, 247, 0.959);" id="work">Brieva O.</h2>

            <a href="https://youtube.com/@warta_tech?si=WtGRYGcXYiXVH-I-" class="yt" id="yt">YouTube</a>

            <img src="images/panahasmara.png" class="panahAsmara" id="panahAsmara" alt="panahasmara">

                <div>
                    <div class="button-container">

        </div>

        <div class="frameTab1" id="frameTab1">

        </div>
        <!-- FRAME TAB KHUSUS PHOTOS -->
        <div class="frameTab1" id="frameTabPhotos" style="transform: translateX(calc(-50% + 120vw)); opacity: 0;">
            <div class="browser-frame">
                <div class="browser-bar" aria-label="PAP browser window controls">
                    <div class="window-controls">
                        <button class="window-control window-control--red" type="button" data-caption-toggle aria-label="Hide caption"></button>

                    <div class="pap-indicators" aria-label="Choose PAP image">
                        <button class="pap-indicator is-active" type="button" aria-label="Show first image" aria-current="true"></button>

                </div>
                </div>
            </div>
        </div>

</body>
